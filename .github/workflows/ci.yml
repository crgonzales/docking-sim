name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: corepack enable
      - run: pnpm install --frozen-lockfile=false
      # Include the real worker-thread bundle equivalence check in the test gate.
      - run: pnpm --filter @docking/web mc:build
      - run: pnpm -r test
      # Production build, including the checksum-verified Takram asset provisioning the Pages build relies on.
      - run: pnpm -r build
